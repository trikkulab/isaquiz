name: Deploy UI su GitHub Pages

# Builda ui/ e pubblica su GitHub Pages ad ogni push su `rel`.
# Manuale: tab Actions -> "Deploy UI su GitHub Pages" -> Run workflow.
#
# Prerequisiti (una tantum, vedi docs/deploy.md):
#  - Settings -> Pages -> Source: "GitHub Actions"
#  - Settings -> Secrets and variables -> Actions: i 6 secret VITE_FIREBASE_*
#    (finche non ci sono, il build passa lo stesso ma le schermate dati vanno
#     in errore a runtime: e' l'interim documentato, solo dogfooding).

on:
  push:
    branches: [rel]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # ui/ importa i moduli di data/, che dipendono dall'SDK firebase:
      # servono le dipendenze di entrambi i package.
      - name: Installa dipendenze (data)
        working-directory: data
        run: npm ci

      - name: Installa dipendenze (ui)
        working-directory: ui
        run: npm ci

      - name: Build
        working-directory: ui
        run: npm run build
        env:
          VITE_BASE: /isaquiz/
          VITE_USE_FIRESTORE_EMULATOR: "false"
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ui/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
